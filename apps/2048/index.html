<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 게임</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
  <div class="container">
    <header>
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">점수</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">최고</span>
          <span class="score-value" id="best-score">0</span>
        </div>
      </div>
    </header>

    <div class="controls">
      <button id="new-game-btn">새 게임</button>
    </div>

    <div class="game-container">
      <div class="grid" id="grid">
        <!-- 16 cells will be generated by JS -->
      </div>
      <div class="tile-container" id="tile-container">
        <!-- Tiles will be rendered here -->
      </div>
      <div class="game-overlay" id="game-overlay">
        <div class="overlay-content">
          <p id="overlay-message"></p>
          <button id="overlay-btn">다시 하기</button>
        </div>
      </div>
    </div>

    <div class="instructions">
      <p>🎯 <strong>2048</strong> 타일을 만드세요!</p>
      <p>방향키 또는 스와이프로 타일을 이동하세요.</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
