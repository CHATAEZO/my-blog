<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>픽셀 아트 에디터</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎨 픽셀 아트</h1>
      <p class="subtitle">16x16 격자에 그림을 그려보세요!</p>
    </header>

    <div class="editor-layout">
      <!-- Toolbar -->
      <div class="toolbar">
        <div class="tool-group">
          <button class="tool-btn active" id="pen-btn" title="펜">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
          </button>
          <button class="tool-btn" id="eraser-btn" title="지우개">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
          <button class="tool-btn" id="fill-btn" title="채우기">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
            </svg>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" id="undo-btn" title="실행 취소">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
            </svg>
          </button>
          <button class="tool-btn" id="clear-btn" title="전체 지우기">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" id="grid-toggle-btn" title="그리드 라인">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Canvas Area -->
      <div class="canvas-area">
        <div class="grid-container" id="grid-container">
          <!-- 16x16 grid will be generated by JS -->
        </div>
      </div>

      <!-- Color Palette -->
      <div class="palette">
        <div class="palette-header">
          <span>색상</span>
          <input type="color" id="color-picker" value="#000000" title="커스텀 색상">
        </div>
        <div class="color-grid" id="color-grid">
          <!-- Colors will be generated by JS -->
        </div>
        <div class="current-color">
          <span>현재:</span>
          <div class="color-preview" id="color-preview"></div>
        </div>
      </div>
    </div>

    <!-- Save Section -->
    <div class="save-section">
      <button class="save-btn" id="save-btn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        PNG로 저장
      </button>
      <div class="save-options">
        <label>
          <input type="radio" name="scale" value="1" checked> 16x16
        </label>
        <label>
          <input type="radio" name="scale" value="2"> 32x32
        </label>
        <label>
          <input type="radio" name="scale" value="4"> 64x64
        </label>
      </div>
    </div>

    <footer>
      <p>클릭 또는 드래그로 그림을 그리세요! 🎨</p>
    </footer>
  </div>

  <script src="editor.js"></script>
</body>
</html>
