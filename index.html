<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <meta name="description" content="마크다운으로 작성된 블로그">

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
</head>
<body>
  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-container">
      <a href="#" class="nav-logo" onclick="event.preventDefault(); navigateTo('/')">
        <span>✍️</span>
        <span>My Blog</span>
      </a>

      <div class="nav-right">
        <ul class="nav-links" id="nav-links">
          <li><a href="#" class="active" onclick="event.preventDefault(); navigateTo('/')">홈</a></li>
        </ul>

        <button class="theme-toggle" id="theme-toggle" aria-label="다크 모드 토글">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>

        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Home Page -->
    <div id="home-page" class="page">
      <section class="hero">
        <div class="container">
          <span class="hero-badge">✍️ 블로그</span>
          <h1>My Blog</h1>
          <p>마크다운으로 작성된 글들을 모아둔 블로그입니다.</p>
        </div>
      </section>

      <section class="search-section">
        <div class="container">
          <div class="search-container">
            <div class="search-box">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <input type="text" id="search-input" placeholder="포스트 검색..." aria-label="검색">
            </div>
            <div class="tags-filter" id="tags-filter"></div>
          </div>
        </div>
      </section>

      <section class="posts-section">
        <div class="container">
          <div class="posts-header">
            <h2>최신 포스트</h2>
            <span class="posts-count" id="posts-count"></span>
          </div>

          <div id="loading" class="loading" style="display: none;">
            <div class="loading-spinner"></div>
          </div>

          <div class="posts-grid" id="posts-grid"></div>
        </div>
      </section>

      <!-- Web Apps Section -->
      <section class="webapps-section">
        <div class="container">
          <div class="posts-header">
            <h2>🎮 웹앱</h2>
          </div>

          <div class="webapps-grid">
            <a href="apps/2048/index.html" class="webapp-card">
              <div class="webapp-icon">🎯</div>
              <div class="webapp-info">
                <h3>2048</h3>
                <p>방향키로 숫자 타일을 밀어서 합치는 퍼즐 게임</p>
                <span class="webapp-tag">게임</span>
              </div>
            </a>

            <a href="apps/pixel-art/index.html" class="webapp-card">
              <div class="webapp-icon">🎨</div>
              <div class="webapp-info">
                <h3>픽셀 아트</h3>
                <p>16x16 격자에 도트를 찍어서 그림을 그리는 에디터</p>
                <span class="webapp-tag">창작</span>
              </div>
            </a>
          </div>
        </div>
      </section>
    </div>

    <!-- Post Page -->
    <div id="post-page" class="page" style="display: none;">
      <div class="post-page-header">
        <div class="container">
          <div class="post-header" id="post-header"></div>
        </div>
      </div>

      <div class="post-layout">
        <div class="post-main">
          <article class="markdown-body" id="post-content"></article>
        </div>

        <aside class="post-sidebar">
          <div class="toc">
            <div class="toc-title">목차</div>
            <ul class="toc-list" id="toc-list"></ul>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 My Blog. Made with ❤️</p>
  </footer>

  <!-- Scroll to Top -->
  <button class="scroll-top" id="scroll-top" aria-label="맨 위로">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
    </svg>
  </button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
